[package]
name = "always-goofy-things"
version = "0.5.18"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0"
futures-util = "0.3"
pdfium-render = "0.9"
regex = "1.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
