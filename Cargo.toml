[package]
name = "always-goofy-things"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0"
futures-util = "0.3"
pdf_oxide = "0.3"
percent-encoding = "2"
regex = "1.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled-full"], optional = true }  # optional: kb feature (bundled-full = FTS5 trigram / JSON1 / RTREE)
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", optional = true }  # optional: kb feature (file_hash / fingerprint)
tokio = { version = "1", features = ["full"] }
unicode-normalization = { version = "0.1", optional = true }  # optional: kb feature (entities.name_norm NFKC)
url = "2"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.35", optional = true }

[features]
default = []
gui = ["dep:eframe"]
kb = ["dep:rusqlite", "dep:sha2", "dep:unicode-normalization"]
