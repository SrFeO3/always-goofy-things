name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --target x86_64-unknown-linux-musl --release

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/always-goofy-things

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp target/x86_64-unknown-linux-musl/release/always-goofy-things release-assets/always-goofy-things
          cp /etc/ssl/certs/ca-certificates.crt release-assets/ca-certificates.crt
          cat <<EOF > release-assets/Dockerfile
          FROM alpine:3.21 AS base
          RUN adduser -D -u 1001 app && chown -R app:app /home/app
          FROM scratch
          COPY --from=base /etc/passwd /etc/passwd
          COPY --from=base /etc/group /etc/group
          COPY --from=base --chown=1001:1001 /home/app /home/app
          COPY always-goofy-things /always-goofy-things
          COPY ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          ENV HOME=/home/app
          WORKDIR /work
          USER app
          ENTRYPOINT ["/always-goofy-things"]
          EOF

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "Automatically built from the latest commit on main branch."
          files: |
            release-assets/always-goofy-things

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: release-assets
          push: true
          tags: ${{ steps.meta.outputs.tags }}